min_version = "2026.7.0"

[tools]
"github:gastownhall/beads" = "1.2.2"
bun = "1.4.0"

[settings]
lockfile = true
http_retries = 10

[tasks.lint]
description = "Run all lints"
run = "bun run lint"

[tasks.typecheck]
description = "Run typechecks"
run = "bun run typecheck"

[tasks.test]
description = "Run unit tests"
run = "bun run test"

[tasks.validate]
description = "Validate OpenSpec specs and changes"
run = "bunx openspec validate --all --no-interactive"

[tasks.validate-sbx]
description = "Validate Docker Sandbox environment files"
run = "bun run check:sbx-env"

