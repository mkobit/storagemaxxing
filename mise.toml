min_version = "2026.3.10"

[tools]
"github:gastownhall/beads" = "1.0.3"
bun = "1.3.13"

[settings]
lockfile = true
http_retries = 10

[tasks.lint]
description = "Run all lints"
run = "bun run lint"

[tasks.typecheck]
description = "Run typechecks"
run = "bun run typecheck"

[tasks.test]
description = "Run unit tests"
run = "bun run test"

[tasks.validate]
description = "Validate OpenSpec specs and changes"
run = "bunx openspec validate --all --no-interactive"

[tasks.bootstrap]
description = "Bootstrap Beads database"
run = "bd bootstrap --yes"
