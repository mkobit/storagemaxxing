schemaVersion: "2"
kind: mixin
name: storagemaxxing-toolchain
version: "0.1.0"
description: Bootstrap mise, bun, beads, and Playwright Chromium toolchain for storagemaxxing

permissions:
  network:
    allow:
      - mise.run
      - mise.jdx.dev
      - github.com
      - api.github.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - bun.sh
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      - storage.googleapis.com
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com

environment:
  variables:
    PATH: /home/agent/.local/share/mise/shims:/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    MISE_YES: "1"

setup:
  startup:
    - command:
        - sh
        - -c
        - |
          set -e
          target="$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          src=$(ls -1 /home/*/.gemini/antigravity-cli/antigravity-oauth-token 2>/dev/null | grep -v "^/home/agent/" | head -n 1 || true)
          if [ -n "$src" ] && [ -f "$src" ]; then
            if [ ! -f "$target" ] || [ "$src" -nt "$target" ]; then
              mkdir -p "$(dirname "$target")"
              cp "$src" "$target"
              chmod 600 "$target"
            fi
          fi
      user: "1000"
      description: "Seed host AGY OAuth token into agent home if mounted"
  install:
    - command: |
        curl -fsSL https://mise.run | MISE_VERSION=v2026.8.14 MISE_INSTALL_PATH=/usr/local/bin/mise sh
        echo 'if command -v mise >/dev/null 2>&1; then eval "$(mise activate bash)"; fi' > /etc/profile.d/mise.sh
        printf '%s\n' 'export PATH="/home/agent/.local/share/mise/shims:/home/agent/.local/bin:$PATH"' >> /etc/sandbox-persistent.sh
      description: "Install mise into /usr/local/bin and configure profile"
    - command: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          fonts-freefont-ttf \
          fonts-ipafont-gothic \
          fonts-liberation \
          fonts-noto-color-emoji \
          fonts-tlwg-loma-otf \
          fonts-unifont \
          fonts-wqy-zenhei \
          libasound2t64 \
          libatk-bridge2.0-0t64 \
          libatk1.0-0t64 \
          libatspi2.0-0t64 \
          libcairo2 \
          libcups2t64 \
          libdbus-1-3 \
          libdrm2 \
          libfontconfig1 \
          libfreetype6 \
          libgbm1 \
          libglib2.0-0t64 \
          libnspr4 \
          libnss3 \
          libpango-1.0-0 \
          libx11-6 \
          libxcb1 \
          libxcomposite1 \
          libxdamage1 \
          libxext6 \
          libxfixes3 \
          libxkbcommon0 \
          libxrandr2 \
          xfonts-cyrillic \
          xfonts-scalable \
          xvfb
        rm -rf /var/lib/apt/lists/*
      description: "Install system dependencies required by Playwright Chromium"
    - command: "mise settings set paranoid false && mise settings set yes true && mise use -g bun@1.4.3 && mise use -g github:gastownhall/beads@1.3.1"
      user: "1000"
      description: "Install bun 1.4.3 and beads 1.3.1 for agent"
    - command: |
        set -e
        export PATH="/home/agent/.local/share/mise/shims:/home/agent/.local/bin:$PATH"
        workdir="${WORKSPACE_DIR:-$(tr '\0' '\n' < /proc/1/environ 2>/dev/null | sed -n 's/^WORKSPACE_DIR=//p' | head -n 1)}"
        workdir="${workdir:-$PWD}"
        if [ -f "$workdir/apps/web/package.json" ]; then
          cd "$workdir"
          if [ ! -x apps/web/node_modules/.bin/playwright ] && [ ! -x node_modules/.bin/playwright ]; then
            bun install --frozen-lockfile
          fi
          bun run --cwd apps/web playwright install chromium
        fi
      user: "1000"
      description: "Install Playwright Chromium browser binary for agent"
