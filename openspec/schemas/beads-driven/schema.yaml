name: beads-driven
version: 1
description: High-integrity Beads & OpenSpec integrated workflow
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.
      Ensure one sentence per line.
      Identify which specs will be created or modified in the Capabilities section.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    optional: true
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.
      Use exactly 4 hashtags (####) for Scenarios.
      Every requirement SHALL have at least one scenario.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document explaining HOW to implement the change.
      Include an **Adversarial Audit** section to identify failure modes and sync conflicts.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Metadata-rich implementation checklist (Beads Source)
    template: tasks.md
    instruction: >
      Break the implementation work into 30-60 min chunks and generate granular tasks directly into the Beads database.


      **GENERATION**: For each task, execute `bd create "<description>"` with the following mandates:

      1. **Labeling**: Add `meta:openspec:<change-name>` AND relevant `scope:`, `type:`, and `domain:` tags.

      2. **Documentation**: Add a detailed `--description` including the "Validation" step (test/command).

      3. **Hierarchy**: Use `--parent` if the task belongs to a specific feature molecule.


      **OUTPUT**: Author `tasks.md` by hand: group tasks under `##` headers, embed each bead's ID
      inline next to its checkbox as `[<id>](../../../.beads)`, and add a `Validation:` sub-bullet
      per task naming the test/command that proves it. Start the file with this header comment:

        ```
        <!--
          Checkbox state is synced from bd, not hand-edited -- update bead status via `bd close <id>`,
          then run `bun run fix:tasks` to regenerate the checkboxes in this file.
        -->
        ```


      Do NOT hand-flip `[ ]`/`[x]` marks as bead status changes. Run `bun run fix:tasks` (or
      `bun run check:tasks` to check without writing) to sync every checkbox to its linked bead's
      closed/open status.
    requires:
      - design
  - id: retrospective
    generates: retrospective.md
    description: Post-implementation review and evidence capture
    template: retrospective.md
    instruction: >
      Conduct an evidence-first retrospective of the completed change.


      **EVIDENCE**: Gather data from:
      1. Git history: `git log <base>..HEAD --stat`
      2. Beads: `bd query "label=meta:openspec:<change-name> AND status=closed"`
      3. Tests: Review latest `bun run test` and `playwright` results.


      **ANALYSIS**: Summarize Wins, Misses, Surprises, and Promote candidates.
    requires:
      - tasks
  - id: reflection
    generates: reflection.md
    description: Process analysis and operational improvement planning
    template: reflection.md
    instruction: >
      Conduct a deep reflection on the development process itself.


      **INPUTS**: Analyze:
      1. Beads metadata: Review issue turnaround time and label consistency.
      2. OpenSpec workflow: Evaluate the clarity of the design and tasks artifacts.
      3. Multi-agent coordination: Identify any sync friction or "guidewire" failures.


      **FOLLOW-UPS**: Propose 1-3 specific actions to improve the project's rails.
      Each follow-up MUST be created as a Beads task with high-fidelity labels:
      - `meta:beads-flow`: For operational loop or formula improvements.
      - `meta:openspec-schema`: For schema.yaml or instruction refinement.
      - `meta:agent-automation`: For slash command or automated tool improvements.

      Format: `bd create "Improve: <topic>" -l meta:<category> -d "From <change-name> reflection..."`


      **OUTPUT**: Document the process insights and list the created follow-up Beads IDs.
    requires:
      - retrospective
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: >
    **STRICT BEADS-DRIVEN APPLY PROTOCOL:**


    1. **SYNC**: Run `git pull` and `bd sync` to ensure cross-agent state consistency.

    2. **CLAIM**: Find open work for this change: `bd query "status=open AND label=meta:openspec:<name>"`.

    3. **LOCK**: Claim a specific Bead with `bd update <id> --claim`.

    4. **EXECUTE**: Implement the code changes required for the claimed Bead.

    5. **CLOSE**: Finalize the implementation: `bd close <id> --reason "..."`.

    6. **PUSH**: Run `git pull --rebase && git push` and `bd dolt push` IMMEDIATELY after every task completion.


    Repeat until all Beads with the `meta:openspec:<name>` label are closed. Once all work is done, proceed sequentially to the `retrospective` and `reflection` artifacts.
