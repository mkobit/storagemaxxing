name: Agentic OpenSpec Pipeline
description: A formalized pipeline mapping OpenSpec changes to executable Beads tasks for autonomous agents.

stages:
  draft:
    description: Initial idea or spike. Creating a rough proposal.
    required_artifacts:
      - proposal.md

  proposal_review:
    description: Proposal is ready for human review and alignment.
    required_artifacts:
      - proposal.md

  design:
    description: Creating the technical architecture and data flow.
    required_artifacts:
      - proposal.md
      - design.md
    rules:
      - Must include an ASCII diagram of the data flow.
      - Must specify Zod schemas for new domain objects.

  design_review:
    description: Technical design is ready for human review.
    required_artifacts:
      - proposal.md
      - design.md

  tasked:
    description: Decomposing the approved design into actionable, iterative tasks.
    required_artifacts:
      - proposal.md
      - design.md
      - tasks.md
    rules:
      - Every task must include a "Validation" step.
      - Break tasks into chunks of max 30 minutes for AI execution.

  implemented:
    description: All linked Beads tasks are completed and code is verified.
    required_artifacts:
      - proposal.md
      - design.md
      - tasks.md

transitions:
  draft_to_proposal:
    from: draft
    to: proposal_review

  approve_proposal:
    from: proposal_review
    to: design

  design_to_review:
    from: design
    to: design_review

  approve_design:
    from: design_review
    to: tasked

  hydrate_and_execute:
    from: tasked
    to: implemented
    action: "Use bead formula `openspec-sync` to hydrate tasks to issue DB"
