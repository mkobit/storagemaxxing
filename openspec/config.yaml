schema: beads-driven

# Project context
# This block is injected into `openspec instructions` for every artifact.
# Stale entries mislead agents: when a tooling or architecture decision changes,
# update this context in the same PR as the change.
context: |
  Tech stack: TypeScript (Strict), React 19, Bun, Zustand, Tailwind CSS.
  Architecture: Layer 1 Packing Engine — Synchronous Geometric Placement (MaxRects) in `packages/packer`.
    Layer 2 (Asynchronous Constraint Satisfaction) is deferred; no solver package exists.
  Package DAG (lint-enforced): geometry -> catalog -> assembly -> packer -> store -> web.
  Domain: Spatial planning for modular storage systems (Gridfinity, Schaller, etc.).
  Standards:
    - Functional programming (immutability, pure functions) in all `packages/`.
    - Strict types (no `any`).
    - Zod for runtime validation.
    - bun test for unit tests (happy-dom for web), Playwright for E2E.

# Per-artifact rules
rules:
  proposal:
    - Always include a "Success Criteria" section.
    - Explicitly state which packages in the DAG are affected.
  design:
    - Must include an ASCII diagram of the data flow.
    - Must specify Zod schemas for new domain objects.
    - Any claim of the form "existing X already does/doesn't do Y" or "no Z should break" must be verified by grepping the actual code or running the actual test suite before being stated as fact -- not inferred from function/test names alone. Reasoning-only claims of this form have shipped false twice (untested `generateAutoFillRects` exclusion path, pixel-asserting e2e tests) and broke during implementation instead of design review.
    - When a change widens/narrows a fixed set consumed by UI (e.g. a `SYSTEMS` array, a tab list), grep `apps/web/e2e/**/*.spec.ts` for the same literal values, not only `src/` -- a fixed-set change to `options-mode` shipped with the e2e spec's hardcoded assertion missed because the grep pass only covered selector/component code.
    - Embedded code snippets are illustrative pseudocode, not verified against the real lint config or schema -- they may need edits (eslint rules, actual field names) during implementation without that being a design defect. Do not present them as copy-paste-ready.
    - Before opening the PR, self-review the specs delta for scenario arithmetic, comparator/tie-break directions, and consistency with the linked bead's acceptance text; note this self-review (and any findings it caught) in the PR body.
  tasks:
    - Every task must include a "Validation" step (e.g., specific test or command).
    - Break tasks into chunks of max 30 minutes for AI execution.
    - When creating Beads issues, always use `bd create --validate --acceptance "..."` so the issue passes `bd lint` immediately.
