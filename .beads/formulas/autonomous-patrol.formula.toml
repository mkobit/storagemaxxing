formula = "autonomous-patrol"
description = "Recurring duty for autonomous agents"
version = 1
type = "workflow"

[vars.duty_name]
description = "Filename in .jules/prompts/"
required = true

[vars.agent_id]
description = "Target agent (e.g., jules, opencode)"
required = true

[[steps]]
id = "execute-patrol"
title = "Patrol: {{duty_name}}"
type = "task"
labels = ["meta:patrol", "actor:{{agent_id}}"]
description = "Read the protocol at `.jules/prompts/{{duty_name}}.md` and execute it fully. Focus on identifying design drift and 'poking holes' in recent implementations. Log findings as a comment."
