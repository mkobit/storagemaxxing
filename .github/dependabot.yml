version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    ignore:
      # typescript-eslint 8.x peer-depends on typescript <6.1.0 (sm-6yom).
      # Drop this once typescript-eslint publishes a release supporting TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      ui:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "three"
          - "@types/three"
          - "@fontsource-variable/*"
      typescript:
        patterns:
          - "typescript"
          - "bun-types"
          - "@types/node"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      testing:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "@testing-library/*"
          - "@axe-core/*"
          - "@happy-dom/*"
          - "happy-dom"
      deploy:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      tooling:
        patterns:
          - "@fission-ai/openspec"
          - "openspec"
          - "knip"
          - "modern-web-guidance"
      protobuf:
        patterns:
          - "@bufbuild/*"
      build:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@eslint-community/*"
          - "@types/eslint*"
          - "jsonc-eslint-parser"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
          - "@stylistic/*"
          - "prettier"
          - "prettier-*"
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "jiti"
      functional-libs:
        patterns:
          - "zod"
          - "idb-keyval"
          - "zustand"
          - "glpk.js"
          - "maxrects-packer"
          - "gl-matrix"
          - "@types/gl-matrix"
      other:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
