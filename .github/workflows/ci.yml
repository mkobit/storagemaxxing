name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Format check
        run: bun run format:check

      - name: Gitignore/eslint-ignores parity check
        run: bun run check:ignore-parity

      - name: Validate Docker Sandbox environments
        run: bun run check:sbx-env

      - name: Dead-code check (knip)
        run: bunx knip

      - name: Bootstrap Beads
        run: bd bootstrap --yes

      - name: Sync Beads from remote
        run: bd dolt pull

      - name: Lint Beads
        run: bd lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun test packages ./.agents/hooks --coverage
          bun --cwd apps/web test src scripts --coverage

  build-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Storybook build
        run: bun run --filter @storagemaxxing/web build-storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(grep -oP '"@playwright/test@\K[0-9.]+' bun.lock | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: bun run --filter @storagemaxxing/web playwright:install

      - name: Golden-path e2e
        run: bun run --filter @storagemaxxing/web test:e2e

  check-stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(grep -oP '"@playwright/test@\K[0-9.]+' bun.lock | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: bun run --filter @storagemaxxing/web playwright:install

      - name: Check stories
        run: bun run --filter @storagemaxxing/web check-stories

  deploy:
    needs: [lint, typecheck, test, build-storybook, e2e, check-stories]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --cwd apps/web build

      - name: Deploy to Cloudflare
        run: bun run --cwd apps/web deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  web-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check for web-impacting changes
        id: filter
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha...$head_sha")"
          if echo "$changed_files" | grep -qE '^(apps/web/|packages/|package\.json$|bun\.lock$|tsconfig\.json$|mise\.toml$|mise\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  preview-deploy:
    needs:
      [lint, typecheck, test, build-storybook, e2e, check-stories, web-changes]
    if: ${{ github.event_name == 'pull_request' && needs.web-changes.outputs.changed == 'true' && github.event.pull_request.head.repo && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    concurrency:
      group: preview-worker-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --cwd apps/web build

      - name: Deploy preview to Cloudflare
        id: deploy
        run: |
          set -euo pipefail
          worker_name="storagemaxxing-web-pr-${{ github.event.pull_request.number }}"
          output_file="$(mktemp)"
          WRANGLER_OUTPUT_FILE_PATH="$output_file" bun run --cwd apps/web preview:deploy --name "$worker_name"
          echo "output_file=$output_file" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify preview deployment and comment PR
        run: |
          bun run --cwd apps/web preview:comment \
            --output-file "${{ steps.deploy.outputs.output_file }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.event.pull_request.head.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
