name: Docker Sandbox validation

on:
  push:
    branches: [main]
    paths:
      - ".sbx/**"
      - "mise.toml"
      - "package.json"
      - "apps/web/package.json"
      - "scripts/check-sbx-env*.ts"
      - ".github/workflows/sbx-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - ".sbx/**"
      - "mise.toml"
      - "package.json"
      - "apps/web/package.json"
      - "scripts/check-sbx-env*.ts"
      - ".github/workflows/sbx-validation.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SBX_VERSION: "v0.49.1"

permissions: {}

jobs:
  validate:
    name: Validate Docker Sandbox kit and environment files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache sbx deb package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: sbx-deb-cache
        with:
          path: /tmp/sbx.deb
          key: sbx-${{ env.SBX_VERSION }}-deb

      - name: Download sbx CLI
        if: steps.sbx-deb-cache.outputs.cache-hit != 'true'
        run: gh release download "${SBX_VERSION}" --repo docker/sbx-releases --pattern "DockerSandboxes-linux-amd64-ubuntu2404.deb" --output /tmp/sbx.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sbx CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y /tmp/sbx.deb
          sbx version

      - name: Validate Docker Sandbox environments
        run: bun run check:sbx-env
