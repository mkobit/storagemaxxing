name: OpenSpec

on:
  push:
    branches: ["main"]
    paths:
      - "openspec/**"
      - ".github/workflows/openspec.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "openspec/**"
      - ".github/workflows/openspec.yml"
  workflow_dispatch: {}

env:
  BUN_VERSION: "1.4.0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate OpenSpec
        run: bunx openspec validate --all --no-interactive

      - name: Bootstrap Beads
        run: bd bootstrap --yes

      - name: Sync Beads from remote
        run: bd dolt pull

      - name: Check OpenSpec tasks match Beads status
        run: bun run check:tasks

      - name: Guard canonical spec edits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          base="origin/${{ github.base_ref }}"
          canonical_changed=$(git diff --name-only "$base"...HEAD | grep -E '^openspec/specs/.*spec\.md$' || true)
          if [ -z "$canonical_changed" ]; then
            echo "No canonical openspec/specs edits — nothing to guard."
            exit 0
          fi
          new_archive_dirs=$(git diff --name-only --diff-filter=A "$base"...HEAD | grep -E '^openspec/changes/archive/[^/]+/' | sed -E 's|^(openspec/changes/archive/[^/]+)/.*$|\1|' | sort -u || true)
          active_changes_with_deltas=$(find openspec/changes -mindepth 2 -maxdepth 2 -type d -name specs -not -path 'openspec/changes/archive/*' 2>/dev/null | sed -E 's|/specs$||' | sort -u || true)
          if [ -z "$new_archive_dirs" ] && [ -n "$active_changes_with_deltas" ]; then
            echo "::error::PR modifies canonical openspec/specs/ while active change deltas exist and no new archive directory was created."
            echo "::error::Canonical specs may only change via 'bunx openspec archive <change-name>'. Do not edit them directly during implementation."
            echo ""
            echo "Canonical files modified:"
            echo "$canonical_changed"
            echo ""
            echo "Active change deltas (must be archived first):"
            echo "$active_changes_with_deltas"
            exit 1
          fi
          echo "Canonical spec edits permitted (archive operation detected or no active deltas)."
