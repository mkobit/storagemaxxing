name: Beads validation
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Bootstrap beads
        run: |
          rm -f .beads/config.yaml
          bunx bd bootstrap --yes

      - name: Verify beads database
        run: bunx bd list --json
          
      - name: Lint issues
        run: bunx bd lint
