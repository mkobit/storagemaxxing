name: Beads Validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 2026.5.6
          cache: true

      - name: Initialize Beads (Local-First)
        run: bd init --non-interactive --from-jsonl --skip-agents --skip-hooks

      - name: Lint Beads
        run: bd lint
