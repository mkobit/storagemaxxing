name: Beads lint

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'push' || github.ref == 'refs/dolt/data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Bootstrap Beads
        run: bd bootstrap --yes

      - name: Sync Beads from remote
        run: bd dolt pull

      - name: Lint Beads
        run: bd lint
