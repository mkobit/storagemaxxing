name: Beads lint

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Bootstrap Beads
        run: bd bootstrap --yes

      - name: Sync Beads from remote
        run: bd dolt pull

      - name: Lint Beads
        run: bd lint
