name: Beads lint

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'push' || github.ref == 'refs/dolt/data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Bootstrap Beads
        run: bd bootstrap --yes

      - name: Sync Beads from remote
        run: bd dolt pull

      - name: Lint Beads
        run: bd lint
